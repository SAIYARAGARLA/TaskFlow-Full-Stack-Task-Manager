
services:
  - type: web
    name: task-manager-api
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput

    startCommand: python manage.py migrate && gunicorn config.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DB_ENGINE
        value: postgresql

      - key: FRONTEND_URL
        sync: false

      - key: ALLOWED_HOSTS
        value: .onrender.com

      - key: DB_NAME
        sync: false

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"
